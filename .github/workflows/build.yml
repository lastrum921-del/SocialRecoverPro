name: Compilar APK

on:
  push:
    branches: [limpiador-movil]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Renombrar APK
        run: cp app/build/outputs/apk/release/app-release.apk LimpiadorMovil.apk

      - name: Publicar descarga
        uses: softprops/action-gh-release@v2
        with:
          tag_name: limpiador-v${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Limpiador Móvil v${{ github.run_number }}
          body: "Descarga LimpiadorMovil.apk en tu móvil Android e instálalo."
          files: LimpiadorMovil.apk
          make_latest: true
