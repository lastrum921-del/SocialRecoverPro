# Compila la app en los servidores de GitHub y publica el APK en "Releases" para descargarlo desde el móvil.
name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04   # la imagen ya incluye el Android SDK
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Comprobar Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - uses: gradle/actions/setup-gradle@v4

      - name: Pruebas del motor
        run: bash ./gradlew :core:test --no-daemon

      - name: Compilar APK de prueba
        run: bash ./gradlew :app:assembleDebug --no-daemon

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: SocialRecoverPro-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar en Releases (descarga fácil desde el móvil)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk SocialRecoverPro.apk
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" SocialRecoverPro.apk \
            --title "SocialRecover Pro (compilación ${{ github.run_number }})" \
            --notes "APK de prueba. En el móvil: descarga SocialRecoverPro.apk, ábrelo y permite instalar apps desconocidas." \
            --prerelease
