# Compila la app en los servidores de GitHub y publica el APK en "Releases" para descargarlo desde el móvil.
name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04   # la imagen ya incluye el Android SDK
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Comprobar Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - uses: gradle/actions/setup-gradle@v4

      - name: Pruebas del motor
        run: bash ./gradlew :core:test --no-daemon

      - name: Compilar APK de prueba
        run: bash ./gradlew :app:assembleDebug --no-daemon

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: SocialRecoverPro-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Compilar programa de PC (srp.jar)
        run: bash ./gradlew :desktop:fatJar --no-daemon

      - name: Guardar srp.jar
        uses: actions/upload-artifact@v4
        with:
          name: srp-jar
          path: desktop/build/libs/srp.jar

  windows:
    # Programa para Windows con Java incluido (no hace falta instalar nada).
    needs: apk
    runs-on: windows-latest
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/download-artifact@v4
        with:
          name: srp-jar
          path: entrada
      - name: Empaquetar SocialRecoverPro para Windows
        shell: pwsh
        run: |
          jpackage --type app-image --name SocialRecoverPro --input entrada --main-jar srp.jar `
            --main-class com.socialrecover.desktop.MainKt --win-console --app-version 1.1.0 --vendor "SocialRecover Pro"
          Compress-Archive -Path SocialRecoverPro -DestinationPath SocialRecoverPro-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: SocialRecoverPro-Windows.zip

  publicar:
    needs: [apk, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Publicar en Releases (descarga fácil desde el móvil y el PC)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp dist/SocialRecoverPro-apk/app-debug.apk SocialRecoverPro.apk
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" SocialRecoverPro.apk dist/windows/SocialRecoverPro-Windows.zip dist/srp-jar/srp.jar \
            --repo "${{ github.repository }}" \
            --title "SocialRecover Pro (compilación ${{ github.run_number }})" \
            --notes "Móvil: descarga SocialRecoverPro.apk e instálalo. PC con Windows: descarga SocialRecoverPro-Windows.zip, descomprímelo y usa SocialRecoverPro.exe (ver docs/WINDOWS.md)." \
            --prerelease
